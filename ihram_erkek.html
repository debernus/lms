<!doctype html>
<html lang="tr">

<style>

  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; padding: 8px;

  button:hover { background: #f3f4f6; }
  #info { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #6b7280; }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }

<body>
<div id="panel">
  <button id="mode">Rida: iki omuz örtülü</button>
  <button id="export">GLB indir</button>
</div>
<div id="info">Sürükle: döndür · Tekerlek: yakınlaştır</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// Birim metre, Y yukarı, karakter +Z'ye bakar (karakterin solu +X), ayak tabanı y = 0, boy 1,80 m, kollar yanda.
const TAU = Math.PI * 2;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- Beden ölçüleri (manken ve kıyafet aynı ölçüleri kullanır) ----------
// Gövde kesiti: yüksekliğe göre elips yarıçapları [y, rx, rz]
// Sporcu yapı: geniş göğüs ve omuz, dar bel, dar kalça
const TORSO = [[0.86, 0.158, 0.108], [0.95, 0.162, 0.112], [1.05, 0.138, 0.096], [1.16, 0.146, 0.102], [1.3, 0.182, 0.122], [1.42, 0.198, 0.112], [1.48, 0.172, 0.09], [1.52, 0.06, 0.06]];
function torso(y) {
  if (y <= TORSO[0][0]) return { rx: TORSO[0][1], rz: TORSO[0][2] };
  for (let i = 1; i < TORSO.length; i++) if (y <= TORSO[i][0]) {
    const [y0, x0, z0] = TORSO[i - 1], [y1, x1, z1] = TORSO[i], t = smooth(y0, y1, y);
    return { rx: lerp(x0, x1, t), rz: lerp(z0, z1, t) };
  }
  const last = TORSO[TORSO.length - 1];
  return { rx: last[1], rz: last[2] };
}
const ellipseR = (rx, rz, a) => 1 / Math.hypot(Math.cos(a) / rx, Math.sin(a) / rz);
const ARM = { y: 1.44, r: 0.05, from: 0.19, to: 0.76 };
const LEG = { x: 0.085 };
const WAIST = 1.05, HEM = 0.12; // izar bileğe kadar

// ---------- Ağ yardımcıları ----------
// rows[j][i] nokta ızgarasından geometri. hint(p): yüzlerin bakması gereken yaklaşık yön. uv(p, i, j).
function gridGeometry(rows, hint, uv) {
  const pos = [], uvs = [], idx = [], n = rows[0].length;
  rows.forEach((row, j) => row.forEach((p, i) => { pos.push(p.x, p.y, p.z); const t = uv(p, i, j); uvs.push(t[0], t[1]); }));
  let vote = 0;
  for (let j = 0; j + 1 < rows.length; j++) for (let i = 0; i + 1 < n; i++) {
    const a = j * n + i, b = a + 1, c = a + n, d = c + 1;
    idx.push(a, b, d, a, d, c);
    const pa = rows[j][i], normal = rows[j][i + 1].clone().sub(pa).cross(rows[j + 1][i + 1].clone().sub(pa));
    vote += normal.dot(hint(pa));
  }
  if (vote < 0) for (let t = 0; t < idx.length; t += 3) [idx[t + 1], idx[t + 2]] = [idx[t + 2], idx[t + 1]];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function mergeGeometries(list) {
  const pos = [], nor = [], uvs = [], idx = [];
  let base = 0;
  for (const g of list) {
    pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); uvs.push(...g.attributes.uv.array);
    for (const i of g.index.array) idx.push(i + base);
    base += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  out.setIndex(idx);
  return out;
}
const radial = (p) => V(p.x, 0, p.z);
const clothUV = (p) => [(Math.atan2(p.z, p.x) / TAU) * 5, p.y * 5];

// ---------- Havlu dokusu (canvas üzerinde üretilir) ----------
function towelTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f3f1ea';
  g.fillRect(0, 0, 256, 256);
  let seed = 7;
  const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  // Havlu ilmekleri: sık, küçük, hafif gölgeli noktalar ve ince dokuma çizgileri
  for (let y = 0; y < 256; y += 4) for (let x = 0; x < 256; x += 4) {
    const ox = (y / 4) % 2 ? 2 : 0, v = rand();
    g.fillStyle = v < 0.5 ? `rgba(120,112,96,${0.05 + v * 0.14})` : `rgba(255,255,255,${0.25 + v * 0.3})`;
    g.beginPath();
    g.arc(x + ox + rand() * 1.5, y + rand() * 1.5, 1.3 + rand() * 0.6, 0, TAU);
    g.fill();
  }
  g.strokeStyle = 'rgba(110,104,90,0.06)';
  for (let y = 0; y < 256; y += 16) g.strokeRect(0, y, 256, 0.01);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.name = 'havlu_dokusu';
  return t;
}
const towel = new THREE.MeshStandardMaterial({ name: 'havlu', color: 0xffffff, map: towelTexture(), roughness: 0.96, metalness: 0, side: THREE.DoubleSide });

// ---------- izar ----------
const FLAP_A = 1.0; // üst üste binen kenarın açısı: önde, sol tarafta (+X +Z)
// İzarın (a, y) yönündeki dış yarıçapı; kat: 1 ise üstte kalan kat dahil
function izarR(a, y, flap = 0) {
  const e = y >= 0.95 ? torso(y) : torso(0.95), grow = y >= 0.95 ? 1 : 1 + 0.12 * ((0.95 - y) / (0.95 - HEM));
  let r = ellipseR((e.rx + 0.012) * grow, (e.rz + 0.012) * grow, a);
  const depth = smooth(1.0, 0.45, y); // kıvrımlar aşağı doğru derinleşir
  r += 0.016 * depth * (0.5 + 0.5 * Math.cos(9 * a + 1.3 + 0.9 * Math.sin(3 * a + y * 2))) ** 1.5;
  r += 0.006 * depth * Math.cos(23 * a + 4 * y);
  return r + flap;
}
function buildIzar() {
  const COLS = 72, rows = [];
  const ring = (y, extra) => Array.from({ length: COLS + 1 }, (_, i) => {
    const u = Math.max(0, (i - 1) / (COLS - 1)), a0 = FLAP_A + 0.25 * (WAIST - y); // kenar aşağı doğru hafifçe yana kayar; ilk iki sütun aynı açıda (kapalı basamak)
    const a = a0 - u * TAU; // üstteki kat kenardan başlayıp sağa doğru sarılır
    const over = i > 0 ? 0.01 * (1 - smooth(0.16, 0.3, u)) : 0; // üstte kalan katın kalınlığı; kenarda keskin basamak
    const r = izarR(a, Math.min(y, WAIST), over) + extra;
    return V(Math.cos(a) * r, y, Math.sin(a) * r);
  });
  rows.push(ring(HEM + 0.004, -0.012)); // etek ucunun içe dönen kenarı
  for (let j = 0; j <= 20; j++) rows.push(ring(lerp(HEM, WAIST - 0.01, j / 20), 0));
  // Belde içe kıvrılmış rulo
  for (const [dy, extra] of [[0.004, 0.005], [0.014, 0.011], [0.027, 0.011], [0.036, 0.005], [0.034, -0.003], [0.022, -0.008]]) rows.push(ring(WAIST + dy, extra));
  const mesh = new THREE.Mesh(gridGeometry(rows, radial, (p, i) => [(i / COLS) * 6, p.y * 5]), towel);
  mesh.name = 'izar';
  return mesh;
}

// ---------- rida ----------
// Gövdeyi saran bölümün dış yarıçapı: gövdenin ve (bel altında) izarın dışında kalır
function ridaR(a, y) {
  const e = torso(y), x0 = Math.cos(a) * 0.17;
  let r = ellipseR(e.rx + 0.013, e.rz + 0.013, a);
  // Bel ve altında izarın (ve belindeki rulonun) hemen dışında kalır; yukarı doğru gövdeye yumuşakça yaklaşır
  const roll = 0.012 * smooth(1.0, 1.04, y) * smooth(1.11, 1.08, y);
  const outer = izarR(a, Math.min(y, WAIST), 0.01) + roll + 0.006;
  r = Math.max(r, lerp(r, outer, smooth(1.15, 1.09, y)));
  return r + 0.006 * (0.5 + 0.5 * Math.cos(40 * (y - 0.75 * x0))) ** 2; // çapraz kıvrımlar
}
// Önde/arkada, x hizasında rida yüzeyinin z'si (side: +1 ön, -1 arka)
function ridaZ(x, y, side) {
  let z = 0.1;
  for (let k = 0; k < 6; k++) {
    const r = ridaR(Math.atan2(side * z, x), y);
    z = Math.sqrt(Math.max(0.0004, r * r - x * x));
  }
  return side * z;
}
// İki omzu örten hâl: boyundan omuzların ve kolların üstünden kalçaya dökülen geniş örtü; önde bir ucu
// ötekinin üstüne çapraz biner.
const SHOULDER = { x: 0.225, y: 1.435 }, HAND = { x: 0.275, y: 0.8 };
function capeEnvelope(y) {
  const e = torso(Math.max(y, 0.95)), d = clamp(SHOULDER.y - y, 0, 1);
  return { rx: 0.288 + d * 0.11, rz: e.rz + 0.042 + d * 0.07 }; // kolları da içine alan, aşağı doğru açılan kesit
}
function buildCape() {
  const COLS = 80, ROWS = 24, SPLIT = 0.26, rows = [];
  const hem = (a) => 0.985 + 0.035 * Math.sin(2 * a + 0.9) - 0.03 * Math.max(0, Math.sin(a)); // etek ucu dalgalı, önde biraz daha uzun
  const seam = (y) => Math.PI / 2 - 0.75 + 1.6 * smooth(1.5, 1.0, y); // üstteki ucun kenarı: sol omuzdan sağ kalçaya çapraz
  const height = (a, t) => {
    if (t < SPLIT) return 1.526 - 0.096 * (t / SPLIT) ** 3.5;
    return lerp(1.43, hem(a), ((t - SPLIT) / (1 - SPLIT)) ** 0.9);
  };
  for (let j = 0; j <= ROWS; j++) {
    const t = j / ROWS;
    rows.push(Array.from({ length: COLS + 1 }, (_, i) => {
      const u = Math.max(0, (i - 1) / (COLS - 1)); // ilk iki sütun aynı açıda: üstteki ucun kenarı kapalı bir basamak olur
      let a = seam(1.5) - u * TAU, y = height(a, t);
      a = seam(y) - u * TAU;
      y = height(a, t);
      const env = capeEnvelope(Math.min(y, 1.43)), outer = ellipseR(env.rx, env.rz, a);
      let r = t < SPLIT ? lerp(ellipseR(0.08, 0.086, a), outer, (t / SPLIT) ** 0.9) : outer;
      const fall = smooth(1.42, 1.0, y);
      r += 0.02 * fall * (0.5 + 0.5 * Math.cos(8 * a + 0.7 + Math.sin(3 * a))) ** 1.5; // aşağı doğru derinleşen dikey kıvrımlar
      r += 0.006 * fall * Math.cos(21 * a + 5 * y);
      r += 0.007 * Math.cos(26 * (y + 0.25 * Math.cos(a - 0.4))) * smooth(1.45, 1.3, y) * Math.max(0, Math.sin(a)) ** 0.5; // göğüste sarkan yatay kıvrımlar
      if (i > 0) r += 0.014 * (1 - smooth(0.1, 0.22, u)) * smooth(0, 0.08, t); // üstte kalan uç
      if (j === ROWS) r -= 0.006;
      return V(Math.cos(a) * r, y, -0.004 + Math.sin(a) * r);
    }));
  }
  const mesh = new THREE.Mesh(gridGeometry(rows, radial, (p, i, j) => [(i / COLS) * 9, (j / ROWS) * 5]), towel);
  mesh.name = 'rida';
  return mesh;
}
function buildRida(bothShoulders) {
  if (bothShoulders) return buildCape();
  const parts = [], COLS = 56, ROWS = 12, BOTTOM = 0.93;
  // 1) Gövdeyi saran bölüm. Iztıbada üst kenar sağ koltuk altından (1,31) sola doğru yükselir.
  const top = (a) => {
    const c = Math.cos(a), side = bothShoulders ? Math.abs(c) : c;
    const rise = bothShoulders ? 1.4 : 1.31 + 0.09 * smooth(-1, 0.25, c);
    return rise - 0.035 * smooth(0.75, 1, side); // kolun altında kalır
  };
  const wrap = [];
  for (let j = 0; j <= ROWS; j++) wrap.push(Array.from({ length: COLS + 1 }, (_, i) => {
    const a = (i / COLS) * TAU, y = lerp(BOTTOM, top(a), j / ROWS);
    const r = ridaR(a, y) + (j === ROWS ? 0.006 : 0) - (j === 0 ? 0.004 : 0);
    return V(Math.cos(a) * r, y, Math.sin(a) * r);
  }));
  parts.push(gridGeometry(wrap, radial, clothUV));
  // 2) Omuzdan aşan bölüm ve öne sarkan uç: tek ızgara (uç → göğüs → omuz üstü → sırt)
  const shoulder = (sx, tailTo) => {
    const C = 9, rows = [], Y0 = 1.36, LIFT = 0.022, XO = 0.265;
    const topY = (x) => 1.502 - 0.012 * smooth(0.07, 0.2, x); // omuz çizgisi ve kolun üstü
    const depth = (x) => Math.max(0.066, Math.abs(ridaZ(Math.min(x, 0.17), Y0, 1)) * Math.sqrt(Math.max(0, 1 - (Math.max(0, x - 0.1) / 0.24) ** 2))); // omuzda yuvarlanan ön-arka derinlik
    const column = (xin, xout, i) => lerp(xin, xout, i / (C - 1));
    // Öne sarkan uç: aşağı doğru kıvrımları derinleşen, kenarı hafifçe içeri çekilen kumaş
    for (let j = 0; j <= 11; j++) {
      const y = lerp(tailTo, Y0, j / 11), fall = smooth(Y0, tailTo, y);
      rows.push(Array.from({ length: C }, (_, i) => {
        const x = column(-0.015 + 0.035 * fall, lerp(XO, 0.2, smooth(0, 0.35, fall)), i);
        const z = ridaZ(Math.min(x, 0.16), Math.max(y, BOTTOM), 1) - Math.max(0, x - 0.16) * 0.55;
        const pleat = 0.016 * fall * Math.cos(i * 1.9 + 0.6) + 0.006 * Math.cos(i * 4.1 + y * 9);
        return V(sx * x, y, z + LIFT + 0.03 * fall + pleat);
      }));
    }
    // Omuzun üstünden sırta: YZ düzleminde yay; iç kenar göğüste ortadan boyun dibine çapraz yükselir
    for (let k = 1; k <= 12; k++) {
      const phi = (k / 12) * Math.PI, s = Math.sin(phi), c = Math.cos(phi);
      rows.push(Array.from({ length: C }, (_, i) => {
        const x = column(lerp(-0.015, 0.078, s ** 0.8), XO, i);
        const fold = 0.004 * Math.cos(i * 2.3 + phi * 3);
        return V(sx * x, Y0 + (topY(x) - Y0 + LIFT) * s + fold, (depth(x) + LIFT) * c);
      }));
    }
    // Sırtta kısa sarkma: gövdeyi saran bölümün üstüne oturur
    for (let j = 1; j <= 4; j++) {
      const y = lerp(Y0, 1.16, j / 4);
      rows.push(Array.from({ length: C }, (_, i) => {
        const x = column(-0.015, lerp(XO, 0.21, j / 4), i);
        return V(sx * x, y, ridaZ(Math.min(x, 0.16), y, -1) + Math.max(0, x - 0.16) * 0.55 - LIFT - 0.004 * Math.cos(i * 2.1));
      }));
    }
    return gridGeometry(rows, (p) => V(sx * 0.3, p.y > 1.4 ? 1 : 0, p.z), (p) => [p.x * 5, (p.y + Math.abs(p.z)) * 5]);
  };
  parts.push(shoulder(1, 0.58)); // sol omuz (+X): uç dizin biraz üstüne kadar
  if (bothShoulders) parts.push(shoulder(-1, 0.8));
  const mesh = new THREE.Mesh(mergeGeometries(parts), towel);
  mesh.name = 'rida';
  return mesh;
}

// ---------- terlikler ----------
const soleMat = new THREE.MeshStandardMaterial({ name: 'terlik_taban', color: 0x3b2618, roughness: 0.85, metalness: 0 });
const strapMat = new THREE.MeshStandardMaterial({ name: 'terlik_kayis', color: 0x121212, roughness: 0.7, metalness: 0, side: THREE.DoubleSide });
function buildSlipper(name, x0) {
  const N = 28, T = 0.02, ZC = 0.045, pos = [], idx = [];
  // Taban: yuvarlak burunlu, topuğa doğru hafif daralan
  const outline = Array.from({ length: N }, (_, k) => {
    const t = (k / N) * TAU, s = Math.sin(t);
    return [x0 + (0.044 + 0.01 * (s + 1) / 2) * Math.cos(t), ZC + 0.138 * s];
  });
  const add = (x, y, z) => pos.push(x, y, z) / 3 - 1;
  const topC = add(x0, T, ZC), botC = add(x0, 0, ZC);
  const topR = outline.map(([x, z]) => add(x, T, z)), botR = outline.map(([x, z]) => add(x, 0, z));
  const sideT = outline.map(([x, z]) => add(x, T, z)), sideB = outline.map(([x, z]) => add(x, 0, z));
  for (let k = 0; k < N; k++) {
    const n = (k + 1) % N;
    idx.push(topC, topR[n], topR[k], botC, botR[k], botR[n], sideT[k], sideT[n], sideB[n], sideT[k], sideB[n], sideB[k]);
  }
  const sole = new THREE.BufferGeometry();
  sole.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  sole.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array((pos.length / 3) * 2), 2));
  sole.setIndex(idx);
  sole.computeVertexNormals();
  // Kayış: parmak köklerinin üstünden geçen tek bant; topuk açık
  const rows = [0.082, 0.1, 0.118, 0.136].map((z, j) => Array.from({ length: 11 }, (_, i) => {
    const a = (i / 10) * Math.PI, lift = j === 0 || j === 3 ? -0.003 : 0;
    return V(x0 + 0.056 * Math.cos(a), T - 0.004 + (0.074 + lift) * Math.sin(a) ** 0.8, z);
  }));
  const strap = gridGeometry(rows, (p) => V(p.x - x0, 1, 0), () => [0, 0]);
  const g = mergeGeometries([sole, strap]);
  g.addGroup(0, sole.index.count, 0);
  g.addGroup(sole.index.count, strap.index.count, 1);
  const mesh = new THREE.Mesh(g, [soleMat, strapMat]);
  mesh.name = name;
  return mesh;
}

// ---------- gri manken (yalnız sahnede; GLB'ye girmez) ----------
function buildMannequin() {
  const m = new THREE.Group(), grey = new THREE.MeshStandardMaterial({ color: 0x9a9da1, roughness: 0.8 });
  const put = (geo, x, y, z) => { const o = new THREE.Mesh(geo, grey); o.position.set(x, y, z); m.add(o); return o; };
  // Gövde: kıyafetle aynı kesitlerden
  const rows = [];
  for (let y = 0.84; y <= 1.521; y += 0.02) {
    const e = torso(y);
    rows.push(Array.from({ length: 33 }, (_, i) => V(Math.cos((i / 32) * TAU) * e.rx, y, Math.sin((i / 32) * TAU) * e.rz)));
  }
  m.add(new THREE.Mesh(gridGeometry(rows, radial, () => [0, 0]), grey));
  put(new THREE.CylinderGeometry(0.052, 0.058, 0.1, 20), 0, 1.55, 0);
  put(new THREE.SphereGeometry(0.105, 28, 20), 0, 1.688, 0.008).scale.set(0.93, 1.07, 1);
  for (const s of [-1, 1]) {
    // Kollar yanda, hafif açık
    const dx = HAND.x - SHOULDER.x, dy = SHOULDER.y - HAND.y, len = Math.hypot(dx, dy);
    const arm = put(new THREE.CylinderGeometry(ARM.r, 0.034, len, 16), s * (SHOULDER.x + HAND.x) / 2, (SHOULDER.y + HAND.y) / 2, 0);
    arm.rotation.z = s * Math.asin(dx / len);
    put(new THREE.SphereGeometry(0.046, 16, 12), s * SHOULDER.x, SHOULDER.y - 0.004, 0);
    put(new THREE.SphereGeometry(0.045, 16, 12), s * (HAND.x + 0.006), HAND.y - 0.06, 0.005).scale.set(0.5, 1.6, 1);
    put(new THREE.CylinderGeometry(0.084, 0.056, 0.4, 18), s * LEG.x, 0.68, 0);
    put(new THREE.CylinderGeometry(0.056, 0.04, 0.4, 18), s * LEG.x, 0.29, 0);
    put(new THREE.SphereGeometry(0.057, 16, 12), s * LEG.x, 0.485, 0.004);
    put(new THREE.SphereGeometry(0.042, 16, 12), s * LEG.x, 0.09, -0.01);
    put(new THREE.SphereGeometry(1, 18, 12), s * LEG.x, 0.052, 0.05).scale.set(0.042, 0.032, 0.122);
  }
  m.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  return m;
}

// ---------- sahne ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e9e6);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
camera.position.set(1.4, 1.5, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.minDistance = 0.5;
controls.maxDistance = 9;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8b8f96, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(2.5, 4.5, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1.6, right: 1.6, top: 2.2, bottom: -0.3 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0xcfcfca, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground, buildMannequin());

// ihram_erkek: GLB'ye yalnız bu grup girer
const ihram = new THREE.Group();
ihram.name = 'ihram_erkek';
scene.add(ihram);
let bothShoulders = true; // varsayılan: iki omuz örtülü
function rebuild() {
  ihram.children.slice().forEach((o) => { ihram.remove(o); o.geometry.dispose(); });
  ihram.add(buildIzar(), buildRida(bothShoulders), buildSlipper('terlik_sol', LEG.x), buildSlipper('terlik_sag', -LEG.x));
  ihram.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  let tris = 0;
  ihram.traverse((o) => { if (o.isMesh) tris += o.geometry.index.count / 3; });
  document.getElementById('info').textContent = `Sürükle: döndür · Tekerlek: yakınlaştır · ${tris} üçgen`;
}
rebuild();

const modeButton = document.getElementById('mode');
modeButton.addEventListener('click', () => {
  bothShoulders = !bothShoulders;
  modeButton.textContent = bothShoulders ? 'Rida: iki omuz örtülü' : 'Rida: ıztıba';
  rebuild();
});
document.getElementById('export').addEventListener('click', () => {
  new GLTFExporter().parse(ihram, (buffer) => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([buffer], { type: 'model/gltf-binary' }));
    link.download = 'ihram_erkek.glb';
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }, (error) => alert('GLB oluşturulamadı: ' + error), { binary: true });
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__view = (pos, target) => { camera.position.fromArray(pos); controls.target.fromArray(target); controls.update(); };
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
