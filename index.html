<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS · 3D Modeller</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f2f2; font: 14px system-ui, sans-serif; color: #1f2937; }
      canvas { display: block; }
      #panel {
        position: fixed; top: 12px; left: 12px; padding: 8px;
        background: rgba(255, 255, 255, 0.9); border: 1px solid #d1d5db; border-radius: 10px;
        display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 40px);
      }
      button {
        padding: 7px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;
        color: inherit; font: inherit; cursor: pointer;
      }
      button:hover { background: #f3f4f6; }
      button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
      .sep { width: 1px; background: #d1d5db; margin: 2px 2px; }
      #hint { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="panel">
      <button data-model="stall">Tezgah</button>
      <button data-model="lamp">Lamba</button>
      <button data-model="desk">Masa</button>
      <button data-model="chair">Sandalye</button>
      <button data-model="cabinet">Dolap</button>
      <button data-model="bandit">Eşkıya</button>
      <button data-model="outfit">Kıyafet</button>
      <button data-model="outfit2">Kıyafet 2</button>
      <button data-model="uzunSacSakal">Uzun saç ve sakal</button>
      <button data-model="yasliKisaSakal">Yaşlı sakalı (kısa)</button>
      <button data-model="yasliSakal">Yaşlı sakalı</button>
      <button data-model="sakal">Sakal</button>
      <button data-model="dosya">Dosya</button>
      <button data-model="koylu1">Köylü 1</button>
      <button data-model="koylu2">Köylü 2</button>
      <button data-model="koylu3">Köylü 3</button>
      <button data-model="kaput">Kaput</button>
      <button data-model="kalpak">Kalpak</button>
      <button data-model="sirmaliCeket">Sırmalı ceket</button>
      <button data-model="sirmali">Sırmalı üniforma</button>
      <button data-model="gemi">Gemi</button>
      <button data-model="kayik">Kayık</button>
      <button data-model="kule">Kule</button>
      <button data-model="pasa">Paşa</button>
      <button data-model="tepsi">Askılı tepsi</button>
      <button data-model="cocuk">Çocuk</button>
      <button data-model="sandik">Boyacı sandığı</button>
      <button data-model="tabanca">Tabanca</button>
      <button data-model="halk5">Halk 5</button>
      <button data-model="halk3">Halk 3</button>
      <button data-model="halk2">Halk 2</button>
      <button data-model="halk1">Halk 1</button>
      <button data-model="zabit">Zabit</button>
      <button data-model="suvari">Süvari</button>
      <button data-model="asker">Asker</button>
      <button data-model="efeTakke">Efe takkesi</button>
      <button data-model="fes">Fes</button>
      <button data-model="character">Karakter</button>
      <span class="sep"></span>
      <button data-view="iso">Çapraz</button>
      <button data-view="front">Ön</button>
      <button data-view="side">Yan</button>
      <button data-view="back">Arka</button>
      <button id="rotate">Otomatik döndür</button>
      <button id="export">GLB indir</button>
    </div>
    <div id="hint">Sürükle: döndür · Tekerlek: yakınlaştır · Sağ tık sürükle: kaydır</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
