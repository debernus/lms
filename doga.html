<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Doğa resimleri</title>
    <style>
      body { margin: 0; padding: 16px; background: #1b1b1b; color: #ddd; font: 14px system-ui, sans-serif; }
      #liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
      figure { margin: 0; background: #000; border: 1px solid #333; }
      figure canvas { width: 100%; display: block; }
      figcaption { display: flex; justify-content: space-between; padding: 6px 8px; background: #262626; }
      a { color: #9cd; }
    </style>
  </head>
  <body>
    <h3>Doğa resimleri (2048 × 2048, kodla çizilir)</h3>
    <div id="liste"></div>
    <script type="module">
      import { RESIMLER, cizResim } from './src/doga_resim.js';
      window.__resim = { RESIMLER, cizResim };
      const liste = document.getElementById('liste');
      for (const ad of RESIMLER) {
        const f = document.createElement('figure'), c = document.createElement('figcaption'), a = document.createElement('a');
        c.textContent = ad + '.png ';
        a.textContent = 'çiz ve indir';
        a.href = '#';
        a.onclick = (e) => { e.preventDefault(); const cv = cizResim(ad); f.querySelector('canvas')?.remove(); f.prepend(cv); cv.toBlob((b) => { const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = ad + '.png'; l.click(); }); };
        c.append(a);
        f.append(c);
        liste.append(f);
      }
    </script>
  </body>
</html>
